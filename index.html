<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo de Vigilância e Fuga (1v1)</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Vigilância e Fuga (1v1)</h1>
      <div id="status-bar" class="status-bar hidden">
        <span id="role-tag" class="role-tag">-</span>
        <span id="match-timer" class="match-timer">00:00</span>
        <button id="btn-quit" class="btn btn-secondary">Finalizar Jogo</button>
      </div>
    </header>

    <!-- Tela 1: Matchmaking / Lobby -->
    <section id="lobby-screen" class="card">
      <h2>Entrar na Partida</h2>
      <p class="subtitle">Encontre um oponente em tempo real</p>
      <div id="lobby-status" class="lobby-status">Pronto para buscar partida.</div>
      <button id="btn-join" class="btn btn-primary">Buscar Partida</button>
    </section>

    <!-- Tela 2: Em Jogo -->
    <section id="play-screen" class="card hidden">
      <div class="room-info">
        <p class="section-label">Localização Atual</p>
        <h2 id="room-name">Carregando sala...</h2>
        <p id="room-desc" class="room-desc"></p>
      </div>

      <!-- Alerta de perigo (Mesma sala) -->
      <div id="alert-banner" class="alert-banner hidden">
        <span class="pulse-icon">⚠️</span>
        <div id="alert-text">ATENÇÃO: O Monstro está na mesma sala!</div>
      </div>

      <!-- Ações de Encontro (Matar / Fugir) -->
      <div id="encounter-actions" class="encounter-actions hidden">
        <button id="btn-kill" class="btn btn-danger hidden">☠️ Matar Sobrevivente</button>
        <div id="flee-notice" class="flee-notice hidden">⚡ Rápido, escolha uma porta para fugir!</div>
      </div>

      <!-- Navegação entre Portas -->
      <div class="navigation-box">
        <h3>Portas Disponíveis</h3>
        <div id="doors-container" class="doors-grid">
          <!-- Portas renderizadas via JS -->
        </div>
      </div>
    </section>

    <!-- Tela 3: Fim de Jogo -->
    <section id="end-screen" class="card hidden">
      <h2 id="end-title">-</h2>
      <p id="end-desc" class="end-desc">-</p>
      <button id="btn-restart" class="btn btn-primary">Voltar ao Lobby</button>
    </section>
  </div>
  <div> <p> teste </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
